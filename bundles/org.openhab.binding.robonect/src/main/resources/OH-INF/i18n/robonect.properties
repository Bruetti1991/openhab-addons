# thing actions

action-direct-label = Drive Wheels
action-direct-description = Send a timed direct wheel command to the mower.
action-output-direct-success-label = Command Accepted
action-input-direct-left-label = Left Wheel Value
action-input-direct-left-description = Signed value from -1000 to 1000 for the left wheel.
action-input-direct-right-label = Right Wheel Value
action-input-direct-right-description = Signed value from -1000 to 1000 for the right wheel.
action-input-direct-timeout-label = Drive Timeout (milliseconds)
action-input-direct-timeout-description = Duration of the wheel command in milliseconds, from 1 to 5000.

action-start-job-label = Start Mowing Job
action-start-job-description = Start a mowing job with optional settings.
action-output-start-job-success-label = Job Accepted
action-input-duration-minutes-label = Duration (minutes)
action-input-duration-minutes-description = Job duration from 1 to 1439 minutes. Defaults to 60 minutes. Ignored, if start and end time is provided.
action-input-start-time-label = Start Time
action-input-start-time-description = Start time in HH:mm in the mower's local time. Defaults to current time
action-input-end-time-label = End Time
action-input-end-time-description = End time in HH:mm in the mower's local time. Defaults to current time plus 60 minutes
action-input-remote-start-label = Remote Start
action-input-remote-start-description = Mower starting point. Possible options: STANDARD, DOCKING_STATION, or REMOTE_1 through REMOTE_5. Defaults to STANDARD.
action-input-after-mode-label = After Job Mode
action-input-after-mode-description = Mode to select after job is done. Possible options: AUTO, HOME, EOD, or MANUAL. If omitted, the previous mode is selected.
