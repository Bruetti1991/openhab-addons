# thing types config

thing-type.config.robonect.mower.ajaxUiScraping.label = Ajax UI Scraping
thing-type.config.robonect.mower.ajaxUiScraping.description = Read additional job and end-of-day status from the localized Robonect web interface.
thing-type.config.robonect.mower.detailedPollInterval.label = Detailed Polling Interval
thing-type.config.robonect.mower.detailedPollInterval.description = The interval in seconds between detailed information polls, independent of the normal polling interval. Set to 0 to disable detailed polling. Also controls push-service mode polling when the unofficial API is enabled.
thing-type.config.robonect.mower.host.label = Host
thing-type.config.robonect.mower.host.description = Host name or network address of the Robonect module
thing-type.config.robonect.mower.offlineTimeout.label = Offline Timeout
thing-type.config.robonect.mower.offlineTimeout.description = The maximum time the mower may be offline before the offline trigger is triggered.
thing-type.config.robonect.mower.password.label = Password
thing-type.config.robonect.mower.password.description = The password if authentication has been enabled on the mower
thing-type.config.robonect.mower.pollInterval.label = Polling Interval
thing-type.config.robonect.mower.pollInterval.description = The interval for the binding to poll the mowers status information.
thing-type.config.robonect.mower.pushPass.label = Push Callback Password
thing-type.config.robonect.mower.pushPass.description = Password the mower sends to openHAB for push notifications. Both callback credentials are required to enable the endpoint.
thing-type.config.robonect.mower.pushUser.label = Push Callback Username
thing-type.config.robonect.mower.pushUser.description = Username the mower sends to openHAB for push notifications. Both callback credentials are required to enable the endpoint.
thing-type.config.robonect.mower.timezone.label = Timezone
thing-type.config.robonect.mower.timezone.description = The timezone configured on the robot (e.g. Europe/Berlin).
thing-type.config.robonect.mower.useUnofficialApi.label = Use Unofficial Web Interface API
thing-type.config.robonect.mower.useUnofficialApi.description = Allow changing remote-start visibility, path, and corridor cut and expose the push-service mode through the unofficial Robonect web interface API.
thing-type.config.robonect.mower.user.label = User
thing-type.config.robonect.mower.user.description = The user id if authentication has been enabled on the mower

